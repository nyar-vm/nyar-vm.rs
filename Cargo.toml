[workspace]
resolver = "2"
members = [
    "projects/formats/nyar-bytecode",
    "projects/runtimes/nyar-gc",
    "projects/runtimes/nyar-jit",
    "projects/runtimes/nyar-vm",
    "projects/hosts/nyar-napi",
    "projects/hosts/nyar-wasm",
    "projects/compilers/nyar",
    "projects/compilers/nyar-analyzer",
    "projects/compilers/nyar-emitter",
    "projects/compilers/nyar-language",
    "projects/compilers/nyar-optimizer",
    "projects/compilers/nyar-package-manager",
    "projects/compilers/nyar-package-registry",
    "projects/compilers/nyar-runner",
    "projects/compilers/nyar-types",
    "projects/compilers/nyar-workspace",
]
default-members = [
    "projects/runtimes/nyar-vm",
    "projects/compilers/nyar-language",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Nyar Team"]
license = "MIT"
repository = "https://github.com/nyar-vm/nyar-vm.rs"

[workspace.dependencies]
# Oak / Acorn：CI 从 git 解析。本机兄弟仓路径写在 `.cargo/config.toml`（见 `config.toml.example`）。
oak-valkyrie = { git = "https://github.com/yggdrasil-language/oak.rs", branch = "dev" }
oak-core = { git = "https://github.com/yggdrasil-language/oak.rs", branch = "dev" }
oak-von = { git = "https://github.com/yggdrasil-language/oak.rs", branch = "dev", features = ["serde"] }
acorn-wasm = { git = "https://github.com/yggdrasil-language/acorn.rs", branch = "dev" }
acorn-jvm = { git = "https://github.com/yggdrasil-language/acorn.rs", branch = "dev" }
acorn-pe = { git = "https://github.com/yggdrasil-language/acorn.rs", branch = "dev" }

nyar = { path = "projects/compilers/nyar" }
nyar-analyzer = { path = "projects/compilers/nyar-analyzer" }
nyar-optimizer = { path = "projects/compilers/nyar-optimizer" }
nyar-types = { path = "projects/compilers/nyar-types" }
nyar-language = { path = "projects/compilers/nyar-language" }
nyar-runner = { path = "projects/compilers/nyar-runner" }
nyar-package-manager = { path = "projects/compilers/nyar-package-manager" }
nyar-package-registry = { path = "projects/compilers/nyar-package-registry" }
nyar-workspace = { path = "projects/compilers/nyar-workspace" }
nyar-napi = { path = "projects/hosts/nyar-napi" }
nyar-wasm = { path = "projects/hosts/nyar-wasm" }
nyar-emitter = { path = "projects/compilers/nyar-emitter" }

nyar-bytecode = { path = "projects/formats/nyar-bytecode" }
nyar-gc = { path = "projects/runtimes/nyar-gc" }
nyar-jit = { path = "projects/runtimes/nyar-jit" }
nyar-vm = { path = "projects/runtimes/nyar-vm" }

miette = "7.6.0"
ordered-float = "5.3.0"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
toml_edit = "0.25.15+spec-1.1.0"
serde_yaml = "0.9.34"
sha1 = "0.11.0"
sha2 = "0.11.0"
url = "2.5.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
pulldown-cmark = "0.13.0"
syntect = "5.2.0"
katex-rs = "0.3.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
flate2 = "1.1.2"
tar = "0.4.44"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
thiserror = "2.0.17"

[profile.release]
lto = false
opt-level = "s"

[profile.dev]
incremental = false

[profile.test]
incremental = false
