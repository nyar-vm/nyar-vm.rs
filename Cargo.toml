[workspace]
resolver = "2"
members = [
    "examples/rusty-valkyrie",
    "projects/formats/odin-bytecode",
    "projects/runtimes/legend-vm",
    "projects/runtimes/nyar-gc",
    "projects/runtimes/nyar-jit",
    "projects/runtimes/odin-vm",
    "projects/hosts/nyar-napi",
    "projects/hosts/nyar-wasm",
    "projects/compilers/nyar",
    "projects/compilers/nyar-analyzer",
    "projects/compilers/nyar-emitter",
    "projects/compilers/nyar-language",
    "projects/compilers/nyar-optimizer",
    "projects/compilers/nyar-package-manager",
    "projects/compilers/nyar-package-registry",
    "projects/compilers/nyar-runner",
    "projects/compilers/nyar-types",
    "projects/compilers/nyar-workspace",
]
default-members = [
    "projects/runtimes/odin-vm",
    "projects/compilers/nyar-language",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Nyar Team"]
license = "MIT"
repository = "https://github.com/nyar-vm/nyar-vm.rs"

[workspace.dependencies]
# Oak / Acorn：CI 从 git 解析。本机兄弟仓路径写在 `.cargo/config.toml`（见 `config.toml.example`）。
acorn-wasm = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "e7ed84a91cb5b5e1771010a1a73e52c2fa807c1d" }
acorn-jvm = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "e7ed84a91cb5b5e1771010a1a73e52c2fa807c1d" }
acorn-pe = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "e7ed84a91cb5b5e1771010a1a73e52c2fa807c1d" }
oak-core = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "a6ababa09448b33bce1618e4dffbc8ef19c9b684" }
oak-von = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "a6ababa09448b33bce1618e4dffbc8ef19c9b684", features = ["serde"] }
oak-valkyrie = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "a6ababa09448b33bce1618e4dffbc8ef19c9b684" }
oak-awsl = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "a6ababa09448b33bce1618e4dffbc8ef19c9b684" }
# Nyar Compiler
nyar = { path = "projects/compilers/nyar" }
nyar-analyzer = { path = "projects/compilers/nyar-analyzer" }
nyar-optimizer = { path = "projects/compilers/nyar-optimizer" }
nyar-types = { path = "projects/compilers/nyar-types" }
nyar-language = { path = "projects/compilers/nyar-language" }
nyar-runner = { path = "projects/compilers/nyar-runner" }
nyar-package-manager = { path = "projects/compilers/nyar-package-manager" }
nyar-package-registry = { path = "projects/compilers/nyar-package-registry" }
nyar-workspace = { path = "projects/compilers/nyar-workspace" }
nyar-napi = { path = "projects/hosts/nyar-napi" }
nyar-wasm = { path = "projects/hosts/nyar-wasm" }
nyar-emitter = { path = "projects/compilers/nyar-emitter" }
# Valkyrie frontend（语言语义与 frontend-owned Semantic MIR）
rusty-valkyrie = { path = "examples/rusty-valkyrie" }
# Nyar Runtime（Nyar 平台的私有运行时）
legend-vm = { path = "projects/runtimes/legend-vm" }
odin-vm = { path = "projects/runtimes/odin-vm" }
odin-bytecode = { path = "projects/formats/odin-bytecode" }
nyar-gc = { path = "projects/runtimes/nyar-gc" }
nyar-jit = { path = "projects/runtimes/nyar-jit" }
# 外部依赖
miette = "7.6.0"
ordered-float = "5.5.0"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
toml_edit = "0.25.17+spec-1.1.0"
serde_yaml = "0.9.34"
sha1 = "0.11.0"
sha2 = "0.11.1"
url = "2.5.8"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
pulldown-cmark = "0.13.4"
syntect = "5.3.0"
katex-rs = "0.3.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
flate2 = "1.1.10"
tar = "0.4.46"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
thiserror = "2.0.21"
napi = { version = "3.14.2", default-features = true, features = ["napi4"] }
napi-derive = "3.6.12"

[profile.release]
lto = false
opt-level = "s"

[profile.dev]
incremental = false

[profile.test]
incremental = false
