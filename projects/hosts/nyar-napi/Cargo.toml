[package]
name = "nyar-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Nyar VM — Node-API native bindings (orthogonal host surface, no CLI)"

[lib]
name = "nyar_napi"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
legend-vm = { workspace = true }
nyar-runner = { workspace = true }
napi.workspace = true
napi-derive.workspace = true

[build-dependencies]
napi-build = "2.6.0"
