[package]
name = "legend-vm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Legend VM — language-agnostic PE / Futamura interpreter substrate"

[lib]
name = "legend_vm"
path = "src/lib.rs"

[dependencies]
acorn-pe = { workspace = true }
miette = { workspace = true }
nyar-analyzer = { workspace = true }
odin-bytecode = { workspace = true }
rusty-bash = { workspace = true }
rusty-c = { workspace = true }
rusty-lua = { workspace = true }
rusty-powershell = { workspace = true }
rusty-tcl = { workspace = true }

# OVM is a Futamura *sink* for probes only — not a lib dependency of the PE substrate.
[dev-dependencies]
odin-vm = { workspace = true }
