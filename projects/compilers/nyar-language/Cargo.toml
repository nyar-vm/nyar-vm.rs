[package]
name = "nyar-language"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Valkyrie language compiler with Chomsky optimization framework"
license.workspace = true
repository = "https://github.com/valkyrie-language/valkyrie.rs"

[features]
default = []
serde = ["nyar-types/serde", "ordered-float/serde"]
# NyarVM bytecode 车道（CallImport / imports 表）；Node/Wasm seed 默认不启用。
ovm-lane = ["nyar-emitter/ovm-lane"]

[dependencies]
# 分层：Oak 文本前端 → language 语义层；guest/tgrammar 等待 Oak 接管。
acorn-pe = { workspace = true }
oak-valkyrie = { workspace = true }
oak-core = { workspace = true }
oak-von = { workspace = true, features = ["serde"] }
oak-awsl = { workspace = true }
nyar = { workspace = true }
nyar-analyzer = { workspace = true }
nyar-emitter = { workspace = true }
nyar-types = { workspace = true }
rusty-valkyrie = { workspace = true }
ordered-float = { workspace = true }
miette = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
syntect = { workspace = true }
katex-rs = { workspace = true }

[dev-dependencies]
odin-bytecode = { workspace = true }
odin-vm = { workspace = true }
