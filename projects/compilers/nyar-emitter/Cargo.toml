[package]
name = "nyar-emitter"
version.workspace = true
edition.workspace = true

authors.workspace = true
license.workspace = true

[features]
default = []
# 正式 Nyar 字节码编译与执行路径；Node/Wasm seed 默认不启用。
nyar-vm-lane = []

[dependencies]
# Layering: language → emitter → std-data (wasm/pe/…) + nyar-bytecode (外码).
# Emitter must not depend on nyar-language.
miette = { workspace = true }
nyar = { workspace = true }
nyar-bytecode = { workspace = true }
nyar-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
std-data = { workspace = true, features = ["serde"] }
zip = { workspace = true }

[dev-dependencies]
# Integration tests may compile Valkyrie sources via the language crate.
nyar-language = { workspace = true }
ordered-float = { workspace = true }
tempfile = { workspace = true }
