[package]
name = "nyar-emitter"
version.workspace = true
edition.workspace = true

authors.workspace = true
license.workspace = true

[features]
default = []
# Nyar VM bytecode lane. Off by default so Node/Wasm seed builds stay slim.
# `nyar-vm-lane` is the preferred consumer name; it enables the same gates as `legacy-lanes`.
legacy-lanes = []
nyar-vm-lane = ["legacy-lanes"]
# Frozen CLR / JVM / native lowering (still on pre-ADR-0010 MIR shape; not required for nyar-vm).
legacy-lanes-clr-jvm-native = []

[dependencies]
# Layering: language → emitter → std-data. Emitter must not depend on nyar-language.
miette = { workspace = true }
nyar = { workspace = true }
nyar-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
std-data = { workspace = true, features = ["serde"] }
zip = { workspace = true }

[dev-dependencies]
# Integration tests may compile Valkyrie sources via the language crate.
nyar-language = { workspace = true }
ordered-float = { workspace = true }
tempfile = { workspace = true }
