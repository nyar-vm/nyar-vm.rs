[package]
name = "nyar-emitter"
version.workspace = true
edition.workspace = true

authors.workspace = true
license.workspace = true

[features]
default = []
# Frozen CLR / JVM / native / nyar-vm lowering. Off by default so Node/Wasm seed builds.
legacy-lanes = []

[dependencies]
# Layering: language → emitter → std-data. Emitter must not depend on nyar-language.
miette = { workspace = true }
nyar = { workspace = true }
nyar-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
std-data = { workspace = true, features = ["serde"] }
zip = { workspace = true }

[dev-dependencies]
# Integration tests may compile Valkyrie sources via the language crate.
nyar-language = { workspace = true }
ordered-float = { workspace = true }
tempfile = { workspace = true }
